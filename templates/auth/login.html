{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block auth %}
<div class="card auth-card">
  <div class="brand center"><span class="logo">✓</span> TaskFlow</div>
  <h2>Welcome back</h2><p class="muted">Log in to manage your work.</p>
  <form method="post" class="form">
    <label>Username or email<input name="username" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted center">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
