{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block heading %}Profile{% endblock %}
{% block content %}
<section class="stats">
  <div class="stat"><span>Tasks</span><strong>{{ counts.tasks }}</strong></div>
  <div class="stat"><span>Projects</span><strong>{{ counts.projects }}</strong></div>
  <div class="stat"><span>Comments</span><strong>{{ counts.comments }}</strong></div>
</section>
<div class="grid-2">
  <form method="post" class="card form"><h3>Account info</h3><input type="hidden" name="action" value="info">
    <label>Username<input value="{{ g.user['username'] }}" disabled></label>
    <label>Full name<input name="full_name" value="{{ g.user['full_name'] }}"></label>
    <label>Email<input type="email" name="email" value="{{ g.user['email'] }}" required></label>
    <div class="row-end"><button class="btn btn-primary">Save</button></div>
  </form>
  <form method="post" class="card form"><h3>Change password</h3><input type="hidden" name="action" value="password">
    <label>Current password<input type="password" name="current" required></label>
    <label>New password<input type="password" name="new" minlength="6" required></label>
    <div class="row-end"><button class="btn btn-primary">Update password</button></div>
  </form>
</div>
{% endblock %}
