{% extends "base.html" %}{% block title %}{{ 'Edit' if project else 'New' }} project{% endblock %}
{% block heading %}{{ 'Edit project' if project else 'New project' }}{% endblock %}
{% block content %}
<form method="post" class="card form narrow">
  <label>Name *<input name="name" required value="{{ project.name if project else '' }}"></label>
  <label>Description<textarea name="description" rows="3">{{ project.description if project else '' }}</textarea></label>
  <label>Colour<input type="color" name="color" value="{{ project.color if project else '#2563eb' }}"></label>
  <div class="row-end"><a class="btn btn-ghost" href="{{ url_for('projects.list_projects') }}">Cancel</a><button class="btn btn-primary">Save project</button></div>
</form>
{% endblock %}
