{% extends "base.html" %}{% block title %}{{ 'Edit' if task else 'New' }} task{% endblock %}
{% block heading %}{{ 'Edit task' if task else 'New task' }}{% endblock %}
{% block content %}
<form method="post" class="card form narrow">
  <label>Title *<input name="title" required value="{{ task.title if task else '' }}"></label>
  <label>Description<textarea name="description" rows="4">{{ task.description if task else '' }}</textarea></label>
  <div class="grid-2">
    <label>Status<select name="status">{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if task and task.status==s }}>{{ s|label }}</option>{% endfor %}</select></label>
    <label>Priority<select name="priority">{% for p in priorities %}<option value="{{ p }}" {{ 'selected' if (task and task.priority==p) or (not task and p=='medium') }}>{{ p|label }}</option>{% endfor %}</select></label>
    <label>Project<select name="project_id"><option value="">— None —</option>{% for p in projects %}<option value="{{ p.id }}" {{ 'selected' if (task and task.project_id==p.id) or preset_project==p.id }}>{{ p.name }}</option>{% endfor %}</select></label>
    <label>Category<select name="category_id"><option value="">— None —</option>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if task and task.category_id==c.id }}>{{ c.name }}</option>{% endfor %}</select></label>
    <label>Due date<input type="date" name="due_date" value="{{ task.due_date if task and task.due_date else '' }}"></label>
  </div>
  <div class="row-end"><a class="btn btn-ghost" href="{{ url_for('tasks.detail', tid=task.id) if task else url_for('tasks.list_tasks') }}">Cancel</a><button class="btn btn-primary">Save task</button></div>
</form>
{% endblock %}
